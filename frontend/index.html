<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowPilot</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c5cff'/><path d='M9 22V10h11M9 16h8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="8" fill="#7c5cff"/><path d="M9 22V10h11M9 16h8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">FlowPilot</span>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="engine-pill" id="enginePill">
        <span class="dot"></span><span id="engineLabel">Idle</span>
      </div>
      <p class="sidebar-note">Local automation control center</p>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="search">
        <svg viewBox="0 0 20 20" width="16" height="16"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13.5 13.5 17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="globalSearch" placeholder="Search records, runs, review items">
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="themeToggle" title="Toggle theme">
          <svg viewBox="0 0 20 20" width="18" height="18"><path d="M16 11.5A6.5 6.5 0 0 1 8.5 4a6.5 6.5 0 1 0 7.5 7.5Z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="logoutBtn" title="Sign out">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12.5 6.5V4.5a1.5 1.5 0 0 0-1.5-1.5H4.5A1.5 1.5 0 0 0 3 4.5v11A1.5 1.5 0 0 0 4.5 17H11a1.5 1.5 0 0 0 1.5-1.5v-2M8 10h9m0 0-2.5-2.5M17 10l-2.5 2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="avatar" title="Operator">OP</div>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
