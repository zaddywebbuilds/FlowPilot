name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No browser needed: the suite covers the engine's logic, the API and the
      # database without launching Chromium.
      - name: Run tests
        run: pytest tests/ -q

      - name: Check the deploy scripts parse
        run: bash -n deploy/install.sh && bash -n deploy/update.sh
